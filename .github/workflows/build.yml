name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: menubar

      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev

      - name: Clippy
        working-directory: menubar
        run: cargo clippy --release -- -D warnings

      - name: 单元测试
        working-directory: menubar
        run: cargo test --release

  build:
    name: Build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            artifact: macos-arm64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: menubar

      - name: 解析发布版本
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "无法从标签解析版本号: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "发布版本: $version"

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev

      - name: Clippy
        working-directory: menubar
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 单元测试
        working-directory: menubar
        run: cargo test --release

      # ---------------- macOS ----------------
      - name: 构建 macOS（.app + .dmg）
        if: runner.os == 'macOS'
        working-directory: menubar
        run: bash deploy/make_dmg.sh

      # ---------------- Windows ----------------
      - name: 构建 Windows
        if: runner.os == 'Windows'
        working-directory: menubar
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\jlau-srun-menubar.exe "dist\JLAU校园网-$env:APP_VERSION-windows-x64.exe"
          Copy-Item ..\config.example.json "dist\config.example.json"

      # ---------------- Linux ----------------
      - name: 构建 Linux
        if: runner.os == 'Linux'
        working-directory: menubar
        run: |
          cargo build --release
          mkdir -p dist/pkg
          cp target/release/jlau-srun-menubar dist/pkg/
          cp ../config.example.json dist/pkg/config.example.json
          cp README.md dist/pkg/README.md
          tar -czf "dist/JLAU校园网-${APP_VERSION}-linux-x64.tar.gz" -C dist/pkg .
          rm -rf dist/pkg

      # ---------------- 产物 ----------------
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jlau-srun-${{ matrix.artifact }}
          path: |
            menubar/dist/*.dmg
            menubar/dist/*.exe
            menubar/dist/*.tar.gz
            menubar/dist/config.example.json
          if-no-files-found: warn

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 清理同标签旧安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              *.dmg|*.exe|*.tar.gz|config.example.json)
                gh release delete-asset "$tag" "$name" --yes
                ;;
            esac
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/config.example.json

