[package]
name = "jlau-srun-menubar"
version = "1.0.2"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
hmac = "0.13.0"
md-5 = "0.11.0"
muda = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tray-icon = "0.26.1"
ureq = { version = "3.5.2", default-features = false, features = ["gzip", "rustls"] }
winit = "0.30.13"
